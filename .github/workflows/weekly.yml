name: Atualizar roleta

on:
  schedule:
    - cron: "0 9 * * 1"     # toda segunda, 09:00 UTC (06:00 em Brasília): trending + newsletter
    - cron: "0 10 1 * *"    # dia 1 de cada mês: reconstrói o catálogo de sementes
  workflow_dispatch:        # botão "Run workflow" para rodar na mão
    inputs:
      catalog:
        description: "Reconstruir o catálogo de sementes?"
        type: boolean
        default: false
      newsletter:
        description: "Enviar a newsletter ao final?"
        type: boolean
        default: false
      source:
        description: "Fonte (goodreads ou openlibrary)"
        default: goodreads

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar o robô
        run: |
          FLAGS="--source ${{ inputs.source || 'goodreads' }}"
          if [ "${{ inputs.catalog }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 10 1 * *" ]; then
            FLAGS="$FLAGS --catalog"
          fi
          echo "flags: $FLAGS"
          python build_pool.py $FLAGS
      - name: Salvar dados no repositório
        run: |
          git config user.name "roleta-bot"
          git config user.email "roleta-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "dados: $(date -u +%Y-%m-%d)"
          git push
      - name: Newsletter
        run: |
          if [ "${{ inputs.newsletter }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 9 * * 1" ]; then
            python newsletter.py
          else
            python newsletter.py --preview
          fi
      - name: Salvar prévia da newsletter
        if: always()
        run: |
          git add data/newsletter-preview.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "prévia da newsletter: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet || true
          git push || true
